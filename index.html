<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diamantes-FFSorteos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
      min-height: 100vh;
    }

    .portada {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at top,
          #3a2500 0%,
          #111 35%,
          #050505 75%
        );
    }

    .corona {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
      margin-bottom: 12px;
    }

    .subtitulo {
      font-size: 18px;
      color: #ddd;
      max-width: 500px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .sorteo {
      width: 100%;
      max-width: 430px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #d4af37;
      border-radius: 20px;
      padding: 25px;

      box-shadow:
        0 0 25px rgba(255, 215, 0, 0.15);
    }

    .sorteo h2 {
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 25px;
    }

    .premio {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .fecha {
      color: #aaa;
      margin-bottom: 25px;
    }

    .boton {
      display: inline-block;
      width: 100%;
      padding: 15px;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          #b8860b
        );

      color: #111;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 12px;
      transition: 0.2s;
    }

    .boton:hover {
      transform: scale(1.03);
    }

    .organizador {
      margin-top: 25px;
      color: #aaa;
      font-size: 15px;
    }

    .organizador strong {
      color: #ffd700;
    }
  </style>
</head>

<body>

  <section class="portada">

    <div class="corona">
      👑
    </div>

    <h1>
      DIAMANTES-FFSORTEOS
    </h1>

    <p class="subtitulo">
      Participa en nuestras dinámicas y sorteos
      de la comunidad de Free Fire. 🎮💎
    </p>

    <div class="sorteo">

      <h2>
        🎁 SORTEO ACTIVO
      </h2>

      <p class="premio">
        🏆 Premio: Próximamente
      </p>

      <p class="fecha">
        📅 Fecha: Próximamente
      </p>

      <a href="#" class="boton">
        PARTICIPAR
      </a>

    </div>

    <p class="organizador">
      Organizado por
      <strong>SOY SIGAS 👑</strong>
    </p>

  </section>

</body>
</html>
